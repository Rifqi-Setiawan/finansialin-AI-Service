services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  chatbot:
    build: ./chatbot-service
    ports:
      - "8001:8001"
    env_file:
      - .env
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379/0

  ocr-api:
    build:
      context: ./ocr-service
      args:
        INSTALL_WORKER_DEPS: "0"
    ports:
      - "8002:8002"
    env_file:
      - .env
    depends_on:
      - redis
    volumes:
      - ./ocr-shared:/tmp/ocr_images
    environment:
      - REDIS_URL=redis://redis:6379/0
      - OCR_IMAGE_DIR=/tmp/ocr_images
      - OCR_WORKER_IMAGE_DIR=${OCR_WORKER_IMAGE_DIR:-/tmp/ocr_images}
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8002"]

  ocr-worker:
    profiles:
      - docker-worker
    build:
      context: ./ocr-service
      args:
        INSTALL_WORKER_DEPS: "1"
    env_file:
      - .env
    depends_on:
      - redis
    volumes:
      - ./ocr-shared:/tmp/ocr_images
    environment:
      - REDIS_URL=redis://redis:6379/0
      - OCR_IMAGE_DIR=/tmp/ocr_images
    command: ["python", "worker.py"]
