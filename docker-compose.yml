version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  chatbot:
    build: ./chatbot-service
    ports:
      - "8001:8001"
    env_file:
      - .env
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379/0

  ocr-api:
    build: ./ocr-service
    ports:
      - "8002:8002"
    env_file:
      - .env
    depends_on:
      - redis
    volumes:
      - ocr_data:/tmp/ocr_images
    environment:
      - REDIS_URL=redis://redis:6379/0
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8002"]

  ocr-worker:
    build: ./ocr-service
    env_file:
      - .env
    depends_on:
      - redis
    volumes:
      - ocr_data:/tmp/ocr_images
    environment:
      - REDIS_URL=redis://redis:6379/0
    command: ["python", "worker.py"]

volumes:
  ocr_data:
